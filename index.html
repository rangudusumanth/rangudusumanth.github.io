<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>regex.network — a live field guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06080F;
  --bg-2: #0B1020;
  --surface: rgba(15, 21, 38, 0.55);
  --surface-solid: #0F1526;
  --surface-elev: #131A2D;
  --border: rgba(120, 160, 220, 0.08);
  --border-bright: rgba(0, 229, 255, 0.28);
  --ink: #EFF2F8;
  --ink-2: #A4B0C8;
  --ink-3: #6B7894;
  --ink-4: #475168;
  --accent: #00E5FF;
  --accent-deep: #00B8D4;
  --accent-glow: rgba(0, 229, 255, 0.4);
  --accent-soft: rgba(0, 229, 255, 0.08);
  --mint: #5EEAD4;
  --mark-bg: rgba(0, 229, 255, 0.16);
  --mark-ink: #DDFAFF;
  --ok: #5EEAD4;
  --warn: #FBBF77;
  --err: #FF7B7B;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--sans);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 100%, rgba(94, 234, 212, 0.05) 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

#net-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0;
  pointer-events: none;
}

::selection { background: var(--accent); color: var(--bg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120, 160, 220, 0.1); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120, 160, 220, 0.18); }

button { font: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

/* ===== TOPBAR ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(6, 8, 15, 0.7);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  z-index: 10;
}

.topbar::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
  background-size: 200% 100%;
  background-position: 100% 0;
  opacity: 0.5;
  animation: scanline 5s linear infinite;
}

@keyframes scanline {
  from { background-position: -100% 0; }
  to { background-position: 100% 0; }
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 15px;
  color: var(--accent);
  letter-spacing: -0.03em;
  background: var(--accent-soft);
  border: 1px solid var(--border-bright);
  padding: 4px 9px;
  border-radius: 5px;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.2), inset 0 0 8px rgba(0, 229, 255, 0.06);
  text-shadow: 0 0 6px var(--accent-glow);
  flex-shrink: 0;
}

.brand-title {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
}

.brand-sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.brand-sub::before {
  content: '//';
  color: var(--accent);
  margin-right: 8px;
  opacity: 0.6;
}

.topbar-right { display: flex; align-items: center; }

.tabs {
  display: flex;
  gap: 2px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}

.tab {
  padding: 7px 14px;
  background: transparent;
  border: none;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  text-transform: lowercase;
  transition: all 0.15s;
}

.tab:hover { color: var(--ink-2); background: rgba(255, 255, 255, 0.025); }

.tab.active {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--border-bright), 0 0 12px rgba(0, 229, 255, 0.12);
}

.icon-btn {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--ink-3);
  transition: all 0.15s;
  margin-left: 8px;
}

.icon-btn:hover {
  background: var(--accent-soft);
  border-color: var(--border-bright);
  color: var(--accent);
}

.icon-btn svg { width: 16px; height: 16px; }

/* ===== LAYOUT ===== */
.shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1280px;
  margin: 0 auto;
  min-height: calc(100vh - 63px);
  position: relative;
  z-index: 1;
}

.curriculum {
  border-right: 1px solid var(--border);
  padding: 24px 22px 40px;
  position: sticky;
  top: 63px;
  height: calc(100vh - 63px);
  overflow-y: auto;
  background: rgba(6, 8, 15, 0.35);
  backdrop-filter: blur(6px);
}

.cur-header {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.cur-progress {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--accent);
  letter-spacing: 0;
  font-weight: 500;
}

.cur-chapter { margin-bottom: 16px; }

.cur-chapter-title {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mint);
  margin-bottom: 6px;
  padding-left: 4px;
  opacity: 0.85;
}

.cur-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-2);
  transition: all 0.12s;
  position: relative;
  font-weight: 400;
  line-height: 1.3;
}

.cur-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 2px;
  height: 0;
  background: var(--accent);
  transform: translateY(-50%);
  transition: height 0.15s;
  border-radius: 2px;
  box-shadow: 0 0 8px var(--accent);
}

.cur-item:hover { background: rgba(255, 255, 255, 0.025); color: var(--ink); }

.cur-item.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.cur-item.active::before { height: 60%; }

.cur-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  min-width: 18px;
  flex-shrink: 0;
  letter-spacing: 0;
}

.cur-item.active .cur-num { color: var(--accent); }
.cur-item.done .cur-num { color: var(--mint); }
.cur-item.done .cur-num::before { content: '●'; }

/* ===== MAIN ===== */
.main {
  padding: 44px 56px 80px;
  min-width: 0;
}

.chapter-label {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.chapter-label::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent), 0 0 4px var(--accent);
}

.lesson-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 14px;
  font-weight: 500;
}

.lesson-title {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 38px;
  line-height: 1.08;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 14px;
  max-width: 680px;
}

.lesson-tag {
  font-family: var(--sans);
  font-style: italic;
  font-size: 17px;
  font-weight: 400;
  color: var(--ink-2);
  margin-bottom: 32px;
  max-width: 580px;
  line-height: 1.45;
}

.lesson-explain {
  font-size: 14.5px;
  line-height: 1.75;
  color: var(--ink-2);
  max-width: 640px;
  margin-bottom: 28px;
}

.lesson-explain p + p { margin-top: 12px; }

.lesson-explain code {
  font-family: var(--mono);
  font-size: 12.5px;
  background: rgba(0, 229, 255, 0.06);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 500;
  border: 1px solid rgba(0, 229, 255, 0.15);
}

/* Syntax */
.syntax {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 30px;
  max-width: 640px;
  overflow: hidden;
  backdrop-filter: blur(8px);
}

.syntax-row {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
  padding: 10px 18px;
  align-items: baseline;
}

.syntax-row + .syntax-row { border-top: 1px solid var(--border); }

.syntax-pat {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.01em;
}

.syntax-desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
}

/* Challenge */
.challenge {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.07), rgba(94, 234, 212, 0.03));
  border: 1px solid rgba(0, 229, 255, 0.2);
  border-left-width: 2px;
  padding: 13px 18px;
  border-radius: 6px;
  margin-bottom: 18px;
  max-width: 640px;
  backdrop-filter: blur(6px);
}

.challenge-label {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 9.5px;
  color: var(--accent);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  flex-shrink: 0;
  padding-top: 3px;
  min-width: 64px;
}

.challenge-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
  font-weight: 400;
}

/* Test string */
.test-label {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.test-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
  max-width: 80%;
}

.test {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.9;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 18px;
  max-width: 640px;
  color: var(--ink);
  min-height: 56px;
  position: relative;
  overflow: hidden;
}

.test::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
}

.test .mark {
  background: var(--mark-bg);
  color: var(--mark-ink);
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  border: 1px solid var(--accent);
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

/* Regex input */
.rx-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 12px;
  max-width: 640px;
}

.rx-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 14px;
  transition: all 0.15s;
}

.rx-input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 22px rgba(0, 229, 255, 0.18);
}

.rx-slash {
  font-family: var(--mono);
  font-size: 18px;
  color: var(--accent);
  font-weight: 500;
  opacity: 0.7;
}

.rx-input-wrap:focus-within .rx-slash { opacity: 1; }

.rx-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  padding: 12px 8px;
  color: var(--ink);
  letter-spacing: -0.005em;
  caret-color: var(--accent);
}

.rx-input::placeholder { color: var(--ink-4); font-weight: 400; }

/* Flags */
.flags {
  display: flex;
  gap: 3px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}

.flag-btn {
  width: 32px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  transition: all 0.15s;
}

.flag-btn:hover:not(:disabled) { color: var(--ink); background: rgba(255, 255, 255, 0.03); }

.flag-btn.on {
  background: var(--accent);
  color: var(--bg);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
}

.flag-btn.on:disabled { background: var(--accent-deep); color: var(--bg); cursor: default; }

/* Status */
.status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  min-height: 28px;
  margin-bottom: 22px;
  max-width: 640px;
  font-family: var(--mono);
  letter-spacing: 0.01em;
}

.status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}

.status.pending { color: var(--ink-3); }
.status.pending .dot { background: var(--ink-3); }

.status.ok { color: var(--ok); font-weight: 500; }
.status.ok .dot { background: var(--ok); box-shadow: 0 0 12px var(--ok); }

.status.warn { color: var(--warn); }
.status.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

.status.err { color: var(--err); }
.status.err .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }

/* Match chips */
.matches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 24px;
  max-width: 640px;
}

.match-chip {
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(0, 229, 255, 0.05);
  border: 1px solid rgba(0, 229, 255, 0.18);
  padding: 3px 10px;
  border-radius: 12px;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.match-chip .idx {
  color: var(--accent);
  font-size: 10px;
  font-weight: 600;
}

/* Nav */
.lesson-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
  max-width: 640px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  transition: all 0.15s;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.03);
  border-color: var(--border-bright);
  color: var(--ink);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.08);
}

.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn:disabled:hover {
  background: var(--surface-solid);
  border-color: var(--border);
  color: var(--ink-2);
  box-shadow: none;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
}

.btn-primary:hover {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--bg);
  box-shadow: 0 0 22px rgba(94, 234, 212, 0.4);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-3);
}

.btn-ghost:hover {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
  box-shadow: none;
}

.btn svg { width: 13px; height: 13px; }

/* Reveal */
.reveal-card {
  background: linear-gradient(135deg, rgba(94, 234, 212, 0.05), rgba(0, 229, 255, 0.025));
  border: 1px solid rgba(94, 234, 212, 0.18);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 24px;
  max-width: 640px;
  display: none;
  backdrop-filter: blur(6px);
}

.reveal-card.show { display: block; }

.reveal-label {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 9.5px;
  color: var(--mint);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.reveal-sol {
  font-family: var(--mono);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface-solid);
  padding: 8px 12px;
  border-radius: 5px;
  display: inline-block;
  margin-bottom: 12px;
  border: 1px solid rgba(0, 229, 255, 0.2);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.08);
}

.reveal-note {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.65;
}

/* Playground */
.playground { max-width: 780px; }

.pg-title {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  color: var(--ink);
}

.pg-tag {
  font-family: var(--sans);
  font-style: italic;
  font-size: 16px;
  color: var(--ink-2);
  margin-bottom: 32px;
}

.pg-section { margin-bottom: 22px; }

.pg-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.pg-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
  max-width: 60%;
}

.pg-textarea {
  width: 100%;
  min-height: 130px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  resize: vertical;
  outline: none;
  color: var(--ink);
  caret-color: var(--accent);
  transition: all 0.15s;
}

.pg-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 20px rgba(0, 229, 255, 0.15);
}

.pg-test {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 60px;
  color: var(--ink);
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
}

.pg-test::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
}

.pg-test .mark {
  background: var(--mark-bg);
  color: var(--mark-ink);
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  border: 1px solid var(--accent);
  box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
}

.pg-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  margin-top: 8px;
  letter-spacing: 0.04em;
}

.pg-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.preset-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--ink-2);
  font-weight: 500;
  letter-spacing: 0.03em;
  transition: all 0.12s;
}

.preset-btn:hover {
  background: var(--accent-soft);
  border-color: var(--border-bright);
  color: var(--accent);
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
}

/* Cheatsheet */
.cheat { max-width: 920px; }

.cheat-title {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  color: var(--ink);
}

.cheat-tag {
  font-family: var(--sans);
  font-style: italic;
  font-size: 16px;
  color: var(--ink-2);
  margin-bottom: 36px;
}

.cheat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}

.cheat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}

.cheat-card:hover {
  border-color: var(--border-bright);
  box-shadow: 0 0 24px rgba(0, 229, 255, 0.08);
  transform: translateY(-2px);
}

.cheat-cat {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.cheat-row {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 12px;
  padding: 4px 0;
  align-items: baseline;
}

.cheat-pat {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}

.cheat-desc {
  font-size: 12px;
  color: var(--ink-2);
  line-height: 1.45;
}

/* Done */
.done {
  text-align: center;
  padding: 60px 20px;
  max-width: 580px;
  margin: 0 auto;
}

.done-mark {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 24px;
  color: var(--accent);
  letter-spacing: -0.04em;
  background: var(--accent-soft);
  border: 1px solid var(--border-bright);
  display: inline-block;
  padding: 14px 22px;
  border-radius: 10px;
  margin-bottom: 28px;
  box-shadow: 0 0 32px rgba(0, 229, 255, 0.2);
  text-shadow: 0 0 12px var(--accent-glow);
}

.done h2 {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: -0.025em;
  margin-bottom: 14px;
  color: var(--ink);
}

.done p {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.7;
  margin-bottom: 22px;
}

/* Mobile */
.menu-toggle { display: none; }

@media (max-width: 900px) {
  .topbar { padding: 11px 16px; }
  .brand-sub { display: none; }
  .brand-title { font-size: 11.5px; }
  .shell { grid-template-columns: 1fr; }
  .curriculum {
    position: fixed;
    top: 56px;
    left: 0; right: 0;
    height: auto;
    max-height: calc(100vh - 56px);

    background: rgba(6, 8, 15, 0.96);

  .curriculum.open { transform: translateY(0); }
  .main { padding: 24px 18px 60px; }
  .lesson-title { font-size: 28px; }
  .lesson-tag { font-size: 15px; margin-bottom: 22px; }
  .syntax-row { grid-template-columns: 100px 1fr; gap: 12px; padding: 9px 14px; }
  .menu-toggle { display: inline-flex; }
  .tab { padding: 6px 10px; font-size: 10.5px; }
  .pg-title, .cheat-title { font-size: 26px; }
}

@media (max-width: 560px) {
  .lesson-title { font-size: 24px; }
  .test, .pg-test, .rx-input { font-size: 12px; }
  .rx-row { flex-direction: column; }
  .flags { align-self: flex-start; }
  .main { padding: 20px 14px 60px; }
}

[data-view] { display: none; }
[data-view].active { display: block; }

<script>
/* === DATA === */
const LESSONS = [
  {
    chapter: "Foundations",
    title: "Literal characters",
    tag: "Every character matches itself.",
    explain: `<p>The simplest regex is a string of literal characters. Each one matches itself, in order. Most letters and digits are literals — only a handful of characters have special meaning, and we'll meet those throughout this field guide.</p><p>Regex is also case-sensitive by default, so <code>fox</code> matches <code>fox</code> but not <code>Fox</code>.</p>`,
    syntax: [
      { p: "abc", d: "matches the exact text 'abc' wherever it appears" },
      { p: "fox", d: "matches the three letters f, o, x in sequence" }
    ],
    challenge: "Match the word fox.",
    test: "The quick brown fox jumps over the lazy dog.",
    expected: ["fox"],
    solution: "fox",
    note: "Literals do all the work most of the time. Reach for special characters only when you need flexibility."
  },
  {
    chapter: "Foundations",
    title: "Case insensitivity",
    tag: "Toggle the i flag to ignore case.",
    explain: `<p>Regex is sharp-eyed by default — <code>cat</code> doesn't match <code>Cat</code>. The <code>i</code> flag tells the engine to ignore letter case entirely.</p><p>In this app, flags live in the toggle row to the right of the regex input. Click <code>i</code> to turn it on.</p>`,
    syntax: [
      { p: "/cat/", d: "matches only lowercase 'cat'" },
      { p: "/cat/i", d: "matches Cat, CAT, cAt, and so on" }
    ],
    challenge: "Match every form of 'cat', regardless of case. Toggle the i flag.",
    test: "Cat, CAT, cat, cAt — all the same to a flexible regex.",
    expected: ["Cat","CAT","cat","cAt"],
    solution: "cat",
    requiredFlags: ["i"],
    note: "Without the i flag, only the lowercase 'cat' would match. The flag affects letters only — digits and punctuation are unchanged."
  },
  {
    chapter: "Foundations",
    title: "The dot, a wildcard",
    tag: "One dot, any character.",
    explain: `<p>A dot <code>.</code> matches any single character except a newline. It's the most useful wildcard in regex, but also the most overused — be careful where you reach for it.</p>`,
    syntax: [
      { p: ".", d: "any single character (except a line break)" },
      { p: ".at", d: "any character followed by 'at': bat, cat, hat, …" }
    ],
    challenge: "Match every 3-letter sequence ending in 'at'.",
    test: "bat cat hat sun fun run",
    expected: ["bat","cat","hat"],
    solution: ".at",
    note: "The dot is greedy and unspecific. When you mean 'any letter', prefer \\w. When you mean 'any digit', prefer \\d."
  },
  {
    chapter: "Foundations",
    title: "Escaping specials",
    tag: "A backslash defangs special characters.",
    explain: `<p>A handful of characters have special meaning in regex: <code>. * + ? ^ $ ( ) [ ] { } | \\</code>. To match them as literals, prefix them with a backslash.</p><p>For example, <code>\\.</code> matches a literal period, and <code>\\\\</code> matches a literal backslash.</p>`,
    syntax: [
      { p: "\\.", d: "a literal dot" },
      { p: "\\?", d: "a literal question mark" },
      { p: "\\\\", d: "a literal backslash" }
    ],
    challenge: "Match the exact text 'U.S.A.' (with the real dots).",
    test: "Visit U.S.A. or U-S-A or USA today.",
    expected: ["U.S.A."],
    solution: "U\\.S\\.A\\.",
    note: "Without escaping, 'U.S.A.' would also match 'U-S-A.' because a bare dot matches any character — including the dash and the period at the end."
  },
  {
    chapter: "Character classes",
    title: "Digits with \\d",
    tag: "Shorthand for any digit.",
    explain: `<p>The shorthand <code>\\d</code> matches any single digit, 0 through 9. It's equivalent to <code>[0-9]</code> but easier to read.</p><p>Its opposite is <code>\\D</code> — any character that isn't a digit. We'll meet the full family of negated shorthands soon.</p>`,
    syntax: [
      { p: "\\d", d: "any digit (0–9)" },
      { p: "\\D", d: "any character that is not a digit" }
    ],
    challenge: "Match every individual digit in the order they appear.",
    test: "Order 4521 ships day 15 with code A92B.",
    expected: ["4","5","2","1","1","5","9","2"],
    solution: "\\d",
    note: "On its own \\d matches one digit at a time. To capture a whole number like '4521' as a single match, we need a quantifier — coming up next."
  },
  {
    chapter: "Quantifiers",
    title: "The plus quantifier",
    tag: "One or more of the previous token.",
    explain: `<p>The <code>+</code> quantifier repeats the previous token one or more times. So <code>\\d+</code> matches a run of digits as one match, and <code>a+</code> matches one or more a's in a row.</p><p>Quantifiers attach to whatever immediately precedes them — a single character, a class, or a group.</p>`,
    syntax: [
      { p: "a+", d: "one or more a's" },
      { p: "\\d+", d: "a run of one or more digits" },
      { p: "\\w+", d: "a run of one or more word characters" }
    ],
    challenge: "Match each run of digits as a single match.",
    test: "Phone: 555-1234 or 800-9999 ext 7",
    expected: ["555","1234","800","9999","7"],
    solution: "\\d+",
    note: "+ requires at least one occurrence. To allow zero too, use the star * (coming up next)."
  },
  {
    chapter: "Quantifiers",
    title: "Star and optional",
    tag: "Zero-or-more and zero-or-one.",
    explain: `<p>The <code>*</code> quantifier matches zero or more — even nothing at all. The <code>?</code> quantifier makes the previous token optional (zero or one).</p><p>So <code>colou?r</code> matches both <em>color</em> and <em>colour</em>: the <code>u</code> is allowed but not required.</p>`,
    syntax: [
      { p: "a*", d: "zero or more a's" },
      { p: "a?", d: "zero or one a (optional)" },
      { p: "colou?r", d: "matches color and colour" }
    ],
    challenge: "Match both spellings — color and colour.",
    test: "Pick a color or colour you like.",
    expected: ["color","colour"],
    solution: "colou?r",
    note: "* and ? can each match the empty string, which can lead to surprising results. The + quantifier from the previous lesson is safer when you really want 'at least one'."
  },
  {
    chapter: "Quantifiers",
    title: "Exact counts with {n,m}",
    tag: "Precise repetition.",
    explain: `<p>When you need an exact count, use curly braces. <code>{3}</code> means exactly three, <code>{2,5}</code> means between two and five, and <code>{2,}</code> means two or more with no upper bound.</p>`,
    syntax: [
      { p: "a{3}", d: "exactly three a's" },
      { p: "a{2,5}", d: "between two and five a's" },
      { p: "a{2,}", d: "two or more a's" }
    ],
    challenge: "Match every 4-digit year.",
    test: "Years 1999, 2024 and short years 99 and 7.",
    expected: ["1999","2024"],
    solution: "\\d{4}",
    note: "Counts give you precise control. Combined with anchors (coming up) you can pin down exact-length tokens like ZIP codes, hex colors, or IDs."
  },
  {
    chapter: "Character classes",
    title: "Words and whitespace",
    tag: "\\w for letters, \\s for spaces.",
    explain: `<p>The shorthand <code>\\w</code> matches a single word character: a letter, digit, or underscore. <code>\\s</code> matches whitespace — spaces, tabs, and newlines.</p><p>Combine with the quantifiers from the previous chapter to grab whole tokens.</p>`,
    syntax: [
      { p: "\\w", d: "a single word character (a–z, A–Z, 0–9, _)" },
      { p: "\\s", d: "a single whitespace character" },
      { p: "\\w+", d: "a run of word characters — a 'word'" }
    ],
    challenge: "Match every word (no punctuation, no spaces).",
    test: "Hello, world! How are you?",
    expected: ["Hello","world","How","are","you"],
    solution: "\\w+",
    note: "Note that \\w includes the underscore — so 'snake_case_name' is one word to regex. To exclude underscores, use a custom class like [a-zA-Z]+."
  },
  {
    chapter: "Character classes",
    title: "Negated shorthands",
    tag: "Capital letters flip the meaning.",
    explain: `<p>Every shorthand has an uppercase counterpart that means the opposite:</p><p><code>\\D</code> is not a digit, <code>\\W</code> is not a word character, <code>\\S</code> is not whitespace.</p>`,
    syntax: [
      { p: "\\D", d: "any non-digit character" },
      { p: "\\W", d: "any non-word character (punctuation, space, …)" },
      { p: "\\S", d: "any non-whitespace character" }
    ],
    challenge: "Match each run of non-digit characters.",
    test: "abc123def456ghi",
    expected: ["abc","def","ghi"],
    solution: "\\D+",
    note: "Negated shorthands are handy when you want to split or skip — like 'everything between the numbers'."
  },
  {
    chapter: "Character classes",
    title: "Custom sets",
    tag: "Brackets define your own class.",
    explain: `<p>Square brackets <code>[ ]</code> define a custom character class. <code>[abc]</code> matches an a, a b, or a c — exactly one character from the set.</p><p>Inside a class, most special characters lose their special meaning. So <code>[.?!]</code> matches a literal dot, question mark, or exclamation point.</p>`,
    syntax: [
      { p: "[abc]", d: "any one of a, b, or c" },
      { p: "[aeiou]", d: "any lowercase vowel" },
      { p: "[.?!]", d: "a dot, question mark, or exclamation" }
    ],
    challenge: "Match every lowercase vowel (a, e, i, o, u).",
    test: "Hello, World!",
    expected: ["e","o","o"],
    solution: "[aeiou]",
    note: "Custom sets are case-sensitive too. To match vowels regardless of case, use [aeiouAEIOU] or turn on the i flag."
  },
  {
    chapter: "Character classes",
    title: "Ranges and negation",
    tag: "Dashes for ranges, ^ to invert.",
    explain: `<p>Inside a character class, a dash creates a range: <code>[a-z]</code> matches any lowercase letter, <code>[0-9]</code> any digit, <code>[A-Za-z0-9]</code> any letter or digit.</p><p>A leading <code>^</code> inverts the class: <code>[^abc]</code> matches anything that's not a, b, or c.</p>`,
    syntax: [
      { p: "[a-z]", d: "any lowercase letter" },
      { p: "[A-Z]", d: "any uppercase letter" },
      { p: "[^0-9]", d: "any character that is not a digit" }
    ],
    challenge: "Match every uppercase letter.",
    test: "Mix UPPER and lower 123 and !@# punctuation.",
    expected: ["M","U","P","P","E","R"],
    solution: "[A-Z]",
    note: "The ^ has two completely different jobs in regex: at the start of a class it negates, and at the start of a pattern it anchors to the start of the line. Context decides which."
  },
  {
    chapter: "Quantifiers",
    title: "Greedy versus lazy",
    tag: "How much does + grab?",
    explain: `<p>By default, quantifiers are greedy — they grab as much as they can. <code>.+</code> on the string <em>&lt;b&gt;bold&lt;/b&gt;</em> matches the whole thing, not just <em>&lt;b&gt;</em>.</p><p>Append a <code>?</code> to a quantifier to make it lazy: it'll grab as little as possible.</p>`,
    syntax: [
      { p: ".+", d: "one or more of any char — greedy" },
      { p: ".+?", d: "one or more, lazy (shortest match)" },
      { p: "<.+?>", d: "matches each tag individually" }
    ],
    challenge: "Match each HTML tag separately. (Greedy would grab everything between the first < and last >.)",
    test: "<b>bold</b> and <i>italic</i>",
    expected: ["<b>","</b>","<i>","</i>"],
    solution: "<.+?>",
    note: "Greedy is the default for a reason — it's usually what you want. Reach for lazy when you're matching delimiters that repeat, like tags, quotes, or brackets."
  },
  {
    chapter: "Anchors",
    title: "Line edges with ^ and $",
    tag: "Match positions, not characters.",
    explain: `<p>Anchors match positions in the string, not characters. <code>^</code> is the start, <code>$</code> is the end.</p><p>By default they refer to the whole string. The <code>m</code> (multiline) flag makes them match the start and end of each line instead.</p>`,
    syntax: [
      { p: "^abc", d: "abc at the very start" },
      { p: "abc$", d: "abc at the very end" },
      { p: "^\\w+", d: "first word (with /m, first word of each line)" }
    ],
    challenge: "Match the first word of each line. Toggle the m flag.",
    test: "The quick fox\nA lazy dog\nThe sneaky cat",
    expected: ["The","A","The"],
    solution: "^\\w+",
    requiredFlags: ["m"],
    note: "Without the m flag, ^ would only match position 0 in the whole input — giving you just 'The' once. The m flag is what makes ^ and $ work per-line."
  },
  {
    chapter: "Anchors",
    title: "Word boundaries",
    tag: "\\b matches at the edge of a word.",
    explain: `<p>A word boundary <code>\\b</code> matches the position between a word character (<code>\\w</code>) and a non-word character — or the start/end of the input.</p><p>It matches a position, not a character, so it takes up no width.</p>`,
    syntax: [
      { p: "\\b", d: "a word boundary (position only)" },
      { p: "\\bcat\\b", d: "the word 'cat', not 'catfish'" },
      { p: "\\B", d: "anywhere that isn't a word boundary" }
    ],
    challenge: "Match 'cat' only when it's a whole word (not inside 'catwalk' or 'catalog').",
    test: "The cat sat on a catwalk. Another cat watched the catalog.",
    expected: ["cat","cat"],
    solution: "\\bcat\\b",
    note: "Word boundaries are everywhere in real-world regex — they prevent matches from bleeding into adjacent text."
  },
  {
    chapter: "Groups",
    title: "Groups and alternation",
    tag: "( ) bundles tokens, | means OR.",
    explain: `<p>Parentheses <code>( )</code> group tokens together so quantifiers and alternation can act on them as a unit.</p><p>The pipe <code>|</code> means OR. Combine them: <code>(cat|dog)</code> matches either word.</p><p>Groups also <em>capture</em> what they match — useful for backreferences and replacements (coming up).</p>`,
    syntax: [
      { p: "(ab)+", d: "one or more 'ab' as a unit" },
      { p: "cat|dog", d: "either cat or dog" },
      { p: "(?:ab)+", d: "non-capturing group — same shape, no capture" }
    ],
    challenge: "Match every cat or dog.",
    test: "I have a cat, a dog, a bird. The dog chased the cat.",
    expected: ["cat","dog","dog","cat"],
    solution: "cat|dog",
    note: "If you don't need to reference what was captured later, use (?:…) — it tells the engine to group these but skip the bookkeeping."
  },
  {
    chapter: "Advanced",
    title: "Backreferences",
    tag: "\\1 refers back to a captured group.",
    explain: `<p>Every capturing group is numbered, starting from 1. You can refer back to a captured match with <code>\\1</code>, <code>\\2</code>, and so on.</p><p>The classic use case is finding doubled words: <code>\\b(\\w+) \\1\\b</code> matches a word followed by the same word.</p>`,
    syntax: [
      { p: "(\\w+) \\1", d: "a word followed by the same word" },
      { p: "<(\\w+)>.*?</\\1>", d: "an HTML tag that matches its closer" },
      { p: "(?<name>\\w+)", d: "named capture group" }
    ],
    challenge: "Match every doubled word, like 'do do' or 'the the'.",
    test: "do do you think the the cat cat ran ran?",
    expected: ["do do","the the","cat cat","ran ran"],
    solution: "\\b(\\w+) \\1\\b",
    note: "Backreferences are powerful for symmetry — palindromes, repeated phrases, paired tags. They also work inside replacements as $1, $2, …"
  },
  {
    chapter: "Advanced",
    title: "Lookarounds",
    tag: "Assert what's around a match without consuming it.",
    explain: `<p>Lookarounds are zero-width assertions. They check what's before or after a position without including those characters in the match itself.</p><p>Use <code>(?=…)</code> for positive lookahead, <code>(?!…)</code> for negative lookahead, <code>(?&lt;=…)</code> and <code>(?&lt;!…)</code> for the lookbehind versions.</p>`,
    syntax: [
      { p: "\\d+(?= USD)", d: "digits followed by ' USD' (USD not in match)" },
      { p: "(?<=\\$)\\d+", d: "digits preceded by '$' (the $ not in match)" },
      { p: "foo(?!bar)", d: "foo not followed by bar" }
    ],
    challenge: "Match dollar amounts — numbers between a '$' and ' USD'.",
    test: "Prices: $50 USD, $120 USD, 75 EUR, $99 GBP",
    expected: ["50","120"],
    solution: "(?<=\\$)\\d+(?= USD)",
    note: "Lookarounds are the regex equivalent of context: 'match this, but only where the surrounding text looks like that.' They unlock patterns you can't write any other way."
  }
];

const CHEAT = [

/* === LOGIC === */
const KEY = 'regex-atelier-v1';
const DEFAULT_PLAYGROUND_TEST = 'Try a pattern above. The Email preset is a good place to start.\n\nReach me at alice@example.com or bob.smith+filter@my-domain.co.uk.';

let state = {
  idx: 0,
  patterns: {},
  flagsPerLesson: {},
  solved: [],
  revealed: [],
  view: 'lesson',
  playground: { pattern: '', flags: { i: false, m: false }, test: DEFAULT_PLAYGROUND_TEST }
};

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    state = Object.assign(state, parsed);
    state.solved = state.solved || [];
    state.revealed = state.revealed || [];
    state.patterns = state.patterns || {};
    state.flagsPerLesson = state.flagsPerLesson || {};
    if (!state.playground) state.playground = { pattern: '', flags: { i: false, m: false }, test: DEFAULT_PLAYGROUND_TEST };
    if (!state.playground.flags) state.playground.flags = { i: false, m: false };
  } catch(e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildFlags(flagsObj) {
  return 'g' + (flagsObj.i ? 'i' : '') + (flagsObj.m ? 'm' : '');
}

function runRegex(pattern, text, flagsObj) {
  if (!pattern) return { matches: [], indices: [], error: null };
  let re;
  try { re = new RegExp(pattern, buildFlags(flagsObj)); }
  catch (e) { return { matches: [], indices: [], error: e.message }; }
  const matches = [], indices = [];
  let m, safety = 0;
  while ((m = re.exec(text)) !== null && safety++ < 1000) {
    if (m[0].length === 0) { re.lastIndex++; continue; }
    matches.push(m[0]);
    indices.push(m.index);
  }
  return { matches, indices, error: null };
}

function highlight(text, pattern, flagsObj) {
  if (!pattern) return escapeHtml(text);
  const { indices, matches, error } = runRegex(pattern, text, flagsObj);
  if (error) return escapeHtml(text);
  let out = '', last = 0;
  for (let i = 0; i < matches.length; i++) {
    out += escapeHtml(text.slice(last, indices[i]));
    out += '<span class="mark">' + escapeHtml(matches[i]) + '</span>';
    last = indices[i] + matches[i].length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function evaluateLesson(pattern, flagsObj, lesson) {
  if (lesson.requiredFlags) {
    for (const f of lesson.requiredFlags) {
      if (!flagsObj[f]) return { kind: 'warn', msg: 'This lesson needs the ' + f + ' flag — toggle it on.' };
    }
  }
  if (!pattern) return { kind: 'pending', msg: 'Type a pattern to see matches.' };
  const { matches, error } = runRegex(pattern, lesson.test, flagsObj);
  if (error) return { kind: 'err', msg: 'Invalid regex — ' + error.split(':').pop().trim() };
  if (arraysEqual(matches, lesson.expected))
    return { kind: 'ok', msg: 'Perfect — ' + matches.length + ' match' + (matches.length===1?'':'es') + ', exactly as expected.' };
  if (matches.length === 0)
    return { kind: 'warn', msg: 'No matches yet. Expected ' + lesson.expected.length + '.' };
  return { kind: 'warn', msg: 'Found ' + matches.length + ' match' + (matches.length===1?'':'es') + ', expected ' + lesson.expected.length + '.' };
}

function renderCurriculum() {
  const chapters = {};
  LESSONS.forEach((L, i) => {
    if (!chapters[L.chapter]) chapters[L.chapter] = [];
    chapters[L.chapter].push({ ...L, idx: i });
  });
  let html = '';
  Object.keys(chapters).forEach(ch => {
    html += '<div class="cur-chapter"><div class="cur-chapter-title">' + escapeHtml(ch) + '</div>';
    chapters[ch].forEach(L => {
      const done = state.solved.includes(L.idx);
      const active = L.idx === state.idx && state.view === 'lesson';
      html += '<div class="cur-item ' + (done?'done ':'') + (active?'active':'') + '" data-idx="' + L.idx + '">';
      html += '<span class="cur-num">' + (done?'':String(L.idx+1).padStart(2,'0')) + '</span>';
      html += '<span>' + escapeHtml(L.title) + '</span></div>';
    });
    html += '</div>';
  });
  document.getElementById('cur-list').innerHTML = html;
  document.getElementById('cur-progress').textContent = state.solved.length + ' / ' + LESSONS.length;
  document.querySelectorAll('.cur-item').forEach(el => {
    el.onclick = () => {
      state.idx = parseInt(el.dataset.idx);
      state.view = 'lesson';
      switchView('lesson');
      document.getElementById('curriculum').classList.remove('open');
    };
  });
}

function renderLesson() {
  if (state.idx >= LESSONS.length) { renderDone(); return; }
  const L = LESSONS[state.idx];
  const lessonFlags = state.flagsPerLesson[state.idx] || { i: false, m: false };
  const pattern = state.patterns[state.idx] || '';
  const revealed = state.revealed.includes(state.idx);

  let html = '';
  html += '<div class="chapter-label">' + escapeHtml(L.chapter) + '</div>';
  html += '<div class="lesson-num">Lesson ' + String(state.idx+1).padStart(2,'0') + ' of ' + String(LESSONS.length).padStart(2,'0') + '</div>';
  html += '<h1 class="lesson-title">' + escapeHtml(L.title) + '</h1>';
  html += '<div class="lesson-tag">' + escapeHtml(L.tag) + '</div>';
  html += '<div class="lesson-explain">' + L.explain + '</div>';

  html += '<div class="syntax">';
  L.syntax.forEach(s => {
    html += '<div class="syntax-row"><div class="syntax-pat">' + escapeHtml(s.p) + '</div><div class="syntax-desc">' + s.d + '</div></div>';
  });
  html += '</div>';

  html += '<div class="challenge"><span class="challenge-label">Challenge</span><span class="challenge-text">' + escapeHtml(L.challenge) + '</span></div>';
  html += '<div class="test-label">Test string</div>';
  html += '<div class="test" id="lesson-test"></div>';

  html += '<div class="rx-row"><div class="rx-input-wrap"><span class="rx-slash">/</span>';
  html += '<input type="text" class="rx-input" id="lesson-input" placeholder="your regex here…" autocomplete="off" spellcheck="false" autocapitalize="off" value="' + escapeHtml(pattern) + '">';
  html += '<span class="rx-slash">/</span></div><div class="flags">';
  ['g','i','m'].forEach(f => {
    const on = f === 'g' ? true : !!lessonFlags[f];
    const disabled = f === 'g' ? 'disabled' : '';
    html += '<button class="flag-btn ' + (on?'on':'') + '" data-flag="' + f + '" ' + disabled + '>' + f + '</button>';
  });
  html += '</div></div>';

  html += '<div class="status" id="lesson-status"><span class="dot"></span><span id="lesson-status-text"></span></div>';
  html += '<div class="matches" id="lesson-matches"></div>';

  const solDisplay = '/' + L.solution + '/g' + (L.requiredFlags?L.requiredFlags.join(''):'');
  html += '<div class="reveal-card ' + (revealed?'show':'') + '" id="lesson-reveal">';
  html += '<div class="reveal-label">Solution</div>';
  html += '<div class="reveal-sol">' + escapeHtml(solDisplay) + '</div>';
  html += '<div class="reveal-note">' + escapeHtml(L.note) + '</div></div>';

  html += '<div class="lesson-nav">';
  html += '<button class="btn" id="lesson-prev" ' + (state.idx===0?'disabled':'') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Previous</button>';
  html += '<button class="btn btn-ghost" id="lesson-reveal-btn">' + (revealed?'Hide solution':'Reveal solution') + '</button>';
  html += '<button class="btn btn-primary" id="lesson-next">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>';
  html += '</div>';

  document.getElementById('view-lesson').innerHTML = html;

  const input = document.getElementById('lesson-input');
  input.addEventListener('input', e => {
    state.patterns[state.idx] = e.target.value;
    updateLessonStatus();
    save();
  });
  setTimeout(() => input.focus(), 30);

  document.querySelectorAll('#view-lesson .flag-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = () => {
      const f = btn.dataset.flag;
      const lf = state.flagsPerLesson[state.idx] || { i: false, m: false };
      lf[f] = !lf[f];
      state.flagsPerLesson[state.idx] = lf;
      btn.classList.toggle('on');
      updateLessonStatus();
      save();
    };
  });

  document.getElementById('lesson-prev').onclick = () => {
    if (state.idx === 0) return;
    state.idx--;
    renderLesson();
    renderCurriculum();
    save();
  };
  document.getElementById('lesson-next').onclick = () => {
    state.idx = Math.min(LESSONS.length, state.idx + 1);
    renderLesson();
    renderCurriculum();
    save();
  };
  document.getElementById('lesson-reveal-btn').onclick = () => {
    const idx = state.idx;
    const L2 = LESSONS[idx];
    if (state.revealed.includes(idx)) {
      state.revealed = state.revealed.filter(i => i !== idx);
    } else {
      state.revealed.push(idx);
      state.patterns[idx] = L2.solution;
      if (L2.requiredFlags) {
        state.flagsPerLesson[idx] = state.flagsPerLesson[idx] || { i: false, m: false };
        L2.requiredFlags.forEach(f => { state.flagsPerLesson[idx][f] = true; });
      }
    }
    renderLesson();
    save();
  };

  updateLessonStatus();
}

function updateLessonStatus() {
  const L = LESSONS[state.idx];
  const pattern = state.patterns[state.idx] || '';
  const lessonFlags = state.flagsPerLesson[state.idx] || { i: false, m: false };
  const testEl = document.getElementById('lesson-test');
  if (!testEl) return;
  testEl.innerHTML = highlight(L.test, pattern, lessonFlags);
  const { matches, error } = runRegex(pattern, L.test, lessonFlags);
  const mEl = document.getElementById('lesson-matches');
  if (pattern && !error && matches.length) {
    mEl.innerHTML = matches.map((m, i) => '<span class="match-chip"><span class="idx">' + (i+1) + '</span>' + escapeHtml(m) + '</span>').join('');
  } else { mEl.innerHTML = ''; }
  const result = evaluateLesson(pattern, lessonFlags, L);
  const statusEl = document.getElementById('lesson-status');
  statusEl.className = 'status ' + result.kind;
  document.getElementById('lesson-status-text').textContent = result.msg;
  if (result.kind === 'ok' && !state.solved.includes(state.idx)) {
    state.solved.push(state.idx);
    renderCurriculum();
    save();
  }
}

function renderDone() {
  let html = '<div class="done">';
  html += '<div class="done-mark">/·/</div>';
  html += '<h2>You\'ve made it.</h2>';
  html += '<p>You\'ve walked through every operator in the regex toolkit — literals, character classes, quantifiers, anchors, groups, lookarounds, and backreferences. From here on, it\'s all practice.</p>';
  html += '<p>Open the <strong>Playground</strong> to test patterns against your own strings, or browse the <strong>Cheatsheet</strong> as a quick reference.</p>';
  html += '<button class="btn btn-primary" id="done-restart">Start over</button>';
  html += '</div>';
  document.getElementById('view-lesson').innerHTML = html;
  document.getElementById('done-restart').onclick = () => {
    state.idx = 0;
    renderLesson();
    renderCurriculum();
    save();
  };
}

function renderCheatsheet() {
  let html = '<h1 class="cheat-title">Cheatsheet</h1>';
  html += '<div class="cheat-tag">Every operator, on one page.</div>';
  html += '<div class="cheat-grid">';
  CHEAT.forEach(cat => {
    html += '<div class="cheat-card"><div class="cheat-cat">' + escapeHtml(cat.cat) + '</div>';
    cat.rows.forEach(r => {
      html += '<div class="cheat-row"><div class="cheat-pat">' + escapeHtml(r.p) + '</div><div class="cheat-desc">' + escapeHtml(r.d) + '</div></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('view-cheatsheet').innerHTML = html;
}

function renderPlayground() {
  let html = '<div class="playground">';
  html += '<h1 class="pg-title">Playground</h1>';
  html += '<div class="pg-tag">Free-form. Bring your own pattern and your own text.</div>';

  html += '<div class="pg-section"><div class="pg-label"><span>Presets</span></div><div class="pg-presets">';
  PRESETS.forEach((p, i) => {
    html += '<button class="preset-btn" data-preset="' + i + '">' + escapeHtml(p.name) + '</button>';
  });
  html += '</div></div>';

  html += '<div class="pg-section"><div class="pg-label">Test string</div>';
  html += '<textarea class="pg-textarea" id="pg-test-input" spellcheck="false">' + escapeHtml(state.playground.test) + '</textarea></div>';

  html += '<div class="pg-section"><div class="pg-label">Pattern</div>';
  html += '<div class="rx-row"><div class="rx-input-wrap"><span class="rx-slash">/</span>';
  html += '<input type="text" class="rx-input" id="pg-pattern" placeholder="your regex here…" autocomplete="off" spellcheck="false" autocapitalize="off" value="' + escapeHtml(state.playground.pattern) + '">';
  html += '<span class="rx-slash">/</span></div><div class="flags">';
  ['g','i','m'].forEach(f => {
    const on = f === 'g' ? true : !!state.playground.flags[f];
    const disabled = f === 'g' ? 'disabled' : '';
    html += '<button class="flag-btn ' + (on?'on':'') + '" data-flag="' + f + '" ' + disabled + '>' + f + '</button>';
  });
  html += '</div></div></div>';

  html += '<div class="pg-section"><div class="pg-label">Live matches</div>';
  html += '<div class="pg-test" id="pg-test-output"></div>';
  html += '<div class="pg-meta" id="pg-meta"></div></div>';
  html += '</div>';

  document.getElementById('view-playground').innerHTML = html;

  document.getElementById('pg-test-input').addEventListener('input', e => {
    state.playground.test = e.target.value;
    updatePlayground();
    save();
  });
  document.getElementById('pg-pattern').addEventListener('input', e => {
    state.playground.pattern = e.target.value;
    updatePlayground();
    save();
  });
  document.querySelectorAll('#view-playground .flag-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = () => {
      const f = btn.dataset.flag;
      state.playground.flags[f] = !state.playground.flags[f];
      btn.classList.toggle('on');
      updatePlayground();
      save();
    };
  });
  document.querySelectorAll('#view-playground .preset-btn').forEach(btn => {
    btn.onclick = () => {
      const p = PRESETS[parseInt(btn.dataset.preset)];
      state.playground.pattern = p.pattern;
      state.playground.flags = { ...p.flags };
      state.playground.test = p.test;
      renderPlayground();
      save();
    };
  });

  updatePlayground();
}

function updatePlayground() {
  const { pattern, flags, test } = state.playground;
  const output = document.getElementById('pg-test-output');
  const meta = document.getElementById('pg-meta');
  if (!output) return;
  if (!pattern) {
    output.innerHTML = escapeHtml(test);
    meta.textContent = 'Type a pattern to see matches.';
    meta.style.color = '';
    return;
  }
  const { matches, error } = runRegex(pattern, test, flags);
  if (error) {
    output.innerHTML = escapeHtml(test);
    meta.textContent = 'Invalid regex — ' + error.split(':').pop().trim();
    meta.style.color = 'var(--err)';
    return;
  }
  output.innerHTML = highlight(test, pattern, flags);
  meta.style.color = '';
  meta.textContent = matches.length + ' match' + (matches.length===1?'':'es') + (matches.length ? ' — /' + pattern + '/' + buildFlags(flags) : '');
}

function switchView(name) {
  state.view = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('[data-view]').forEach(v => v.classList.toggle('active', v.dataset.view === name));
  if (name === 'lesson') { renderLesson(); renderCurriculum(); }
  else if (name === 'playground') renderPlayground();
  else if (name === 'cheatsheet') renderCheatsheet();
  save();
}

function setupEvents() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => switchView(t.dataset.tab);
  });
  document.getElementById('menu-toggle').onclick = () => {
    document.getElementById('curriculum').classList.toggle('open');
  };
  document.getElementById('reset-btn').onclick = () => {
    if (!confirm('Reset all progress? This clears your saved lessons and playground.')) return;
    try { localStorage.removeItem(KEY); } catch(e) {}
    state = {
      idx: 0,
      patterns: {},
      flagsPerLesson: {},
      solved: [],
      revealed: [],
      view: 'lesson',
      playground: { pattern: '', flags: { i: false, m: false }, test: DEFAULT_PLAYGROUND_TEST }
    };
    switchView('lesson');
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (state.view !== 'lesson') return;
    if (e.key === 'ArrowRight') { state.idx = Math.min(LESSONS.length, state.idx + 1); renderLesson(); renderCurriculum(); save(); }
    if (e.key === 'ArrowLeft' && state.idx > 0) { state.idx--; renderLesson(); renderCurriculum(); save(); }
  });
}

load();
setupEvents();
renderCheatsheet();
renderPlayground();
renderCurriculum();
renderLesson();
switchView(state.view || 'lesson');

/* === NETWORK BACKGROUND === */
(function() {
  const canvas = document.getElementById('net-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, nodes = [];
  const mouse = { x: -9999, y: -9999, active: false };
  const MAX_DIST = 150;

  // Pre-render glow sprite for cheap node halos
  const glowSize = 32;
  const glow = document.createElement('canvas');
  glow.width = glowSize; glow.height = glowSize;
  const gctx = glow.getContext('2d');
  const ggrad = gctx.createRadialGradient(glowSize/2, glowSize/2, 0, glowSize/2, glowSize/2, glowSize/2);
  ggrad.addColorStop(0, 'rgba(0, 229, 255, 0.55)');
  ggrad.addColorStop(0.35, 'rgba(0, 229, 255, 0.12)');
  ggrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
  gctx.fillStyle = ggrad;
  gctx.fillRect(0, 0, glowSize, glowSize);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const target = Math.min(110, Math.max(40, Math.floor((W * H) / 15000)));
    if (nodes.length < target) {
      while (nodes.length < target) nodes.push(makeNode());
    } else {
      nodes.length = target;
    }
  }

  function makeNode() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22,
      r: 0.9 + Math.random() * 1.2,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.008 + Math.random() * 0.012
    };
  }

  let last = 0;
  function tick(now) {
    const dt = Math.min(50, now - last); last = now;
    ctx.clearRect(0, 0, W, H);

    // Update + draw nodes underneath the lines
    for (const n of nodes) {
      n.x += n.vx * (dt / 16);
      n.y += n.vy * (dt / 16);
      if (n.x < -10) n.x = W + 10;
      if (n.x > W + 10) n.x = -10;
      if (n.y < -10) n.y = H + 10;
      if (n.y > H + 10) n.y = -10;
      n.pulse += n.pulseSpeed;
    }

    // Lines between nearby nodes
    ctx.lineWidth = 0.55;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < MAX_DIST * MAX_DIST) {
          const d = Math.sqrt(d2);
          const alpha = (1 - d / MAX_DIST) * 0.16;
          ctx.strokeStyle = 'rgba(0, 229, 255, ' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // Mouse halo lines
    if (mouse.active) {
      const R = 200;
      for (const n of nodes) {
        const dx = mouse.x - n.x, dy = mouse.y - n.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          const d = Math.sqrt(d2);
          const alpha = (1 - d / R) * 0.45;
          ctx.strokeStyle = 'rgba(94, 234, 212, ' + alpha.toFixed(3) + ')';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(n.x, n.y);
          ctx.stroke();
        }
      }
    }

    // Node glow + core
    ctx.globalCompositeOperation = 'lighter';
    for (const n of nodes) {
      const pulse = 0.85 + Math.sin(n.pulse) * 0.25;
      const haloSize = 22 * pulse;
      ctx.drawImage(glow, n.x - haloSize/2, n.y - haloSize/2, haloSize, haloSize);
    }
    ctx.globalCompositeOperation = 'source-over';

    for (const n of nodes) {
      const pulse = 0.85 + Math.sin(n.pulse) * 0.25;
      ctx.fillStyle = 'rgba(180, 245, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseleave', () => { mouse.active = false; });
  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) {
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { mouse.active = false; });

  resize();
  requestAnimationFrame(tick);
})();

</script>

</body>
</html>
